version: "3.9"

# ─── PRODUCTION: connects to external AWS RDS (no db container) ───────────────
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# Requires: backend/.env with real DATABASE_URL pointing to RDS

services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    restart: always
    expose:
      - "4000"

  frontend:
    build: ./frontend
    restart: always
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: always
